<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="2" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.1"/>
    </filter>
    <style>
      .bg { fill:#fbf7ef; }
      .title { font-family: "Noto Serif TC", "PingFang TC", serif; fill:#2e2a24; font-size:54px; font-weight:500; }
      .sub { font-family: "Noto Sans TC", "PingFang TC", sans-serif; fill:#756a5f; font-size:24px; letter-spacing:.08em; }
      .label { font-family: "Noto Serif TC", "PingFang TC", serif; fill:#2e2a24; font-size:32px; font-weight:500; text-anchor:middle; }
      .en { font-family: "Noto Sans", Arial, sans-serif; fill:#8b7d70; font-size:15px; letter-spacing:.16em; text-anchor:middle; }
      .card { fill:#fffdf8; stroke:#e9decf; stroke-width:2; }
      .wash-green { fill:#dbece3; opacity:.78; }
      .wash-terra { fill:#efd6c8; opacity:.72; }
      .wash-yellow { fill:#f6e8af; opacity:.72; }
      .wash-blue { fill:#dbe8ea; opacity:.72; }
      .ink { fill:none; stroke:#3c332d; stroke-width:5.2; stroke-linecap:round; stroke-linejoin:round; filter:url(#rough); }
      .thin { fill:none; stroke:#3c332d; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; filter:url(#rough); }
      .green { fill:none; stroke:#5a9080; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; filter:url(#rough); }
      .terra { fill:none; stroke:#c17a5a; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; filter:url(#rough); }
      .yellow { fill:none; stroke:#d7b756; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; filter:url(#rough); }
      .fill-green { fill:#9ccbb7; opacity:.68; filter:url(#rough); }
      .fill-terra { fill:#d89576; opacity:.68; filter:url(#rough); }
      .fill-yellow { fill:#ead070; opacity:.75; filter:url(#rough); }
      .fill-blue { fill:#8eb9bd; opacity:.54; filter:url(#rough); }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1040"/>
  <rect width="1600" height="1040" fill="#fffaf1" filter="url(#paper)" opacity=".72"/>
  <text x="104" y="112" class="title">八大主題法 · 手繪感小圖示預覽</text>
  <text x="108" y="158" class="sub">watercolor pencil / warm handmade icons / not flat digital</text>

  <g transform="translate(90 220)">
