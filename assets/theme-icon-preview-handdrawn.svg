    <g transform="translate(0 390)">
      <rect class="card" width="320" height="330" rx="38"/>
      <ellipse class="wash-yellow" cx="162" cy="128" rx="94" ry="78"/>
      <path class="ink" d="M105 184c-28-34-21-83 18-110 38-26 96-19 118 22 16 30 5 66-22 84-14 9-29 7-41-5-10-10-23-12-35-5-17 10-26 18-38 14z"/>
      <circle class="fill-terra" cx="126" cy="112" r="15"/>
