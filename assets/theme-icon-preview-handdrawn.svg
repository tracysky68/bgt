      <text x="160" y="292" class="en">WILD ART</text>
    </g>

    <g transform="translate(1140 390)">
      <rect class="card" width="320" height="330" rx="38"/>
      <ellipse class="wash-green" cx="162" cy="128" rx="98" ry="82"/>
      <path class="fill-yellow" d="M89 152l72-66 71 66v54H89z"/>
      <path class="ink" d="M89 152l72-66 71 66v54H89zM118 206v-45h38v45M181 166h29v25h-29z"/>
